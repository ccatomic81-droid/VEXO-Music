plugins { id 'com.android.application' }
android {
    namespace 'space.vexo.music'
    compileSdk 35
    defaultConfig {
        applicationId 'space.vexo.music.radio'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.12.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // Signing material is injected only at build time, never stored in the repository.
    signingConfigs {
        authorizedRelease {
            if (System.getenv('VEXO_KEYSTORE_PATH')) {
                storeFile file(System.getenv('VEXO_KEYSTORE_PATH'))
                storePassword System.getenv('VEXO_KEYSTORE_PASSWORD')
                keyAlias System.getenv('VEXO_KEY_ALIAS')
                keyPassword System.getenv('VEXO_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('VEXO_KEYSTORE_PATH')) signingConfig signingConfigs.authorizedRelease
        }
    }
    buildFeatures { buildConfig true }
    defaultConfig {
        def updateFeed = 'https://vexo-music-updates.kavindukavishka785.workers.dev/stable.json'
        buildConfigField 'String', 'UPDATE_FEED_URL', groovy.json.JsonOutput.toJson(updateFeed)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST'] }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.base/java.net=ALL-UNNAMED', '--add-opens=java.base/java.security=ALL-UNNAMED', '--add-opens=java.base/java.text=ALL-UNNAMED', '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED', '--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            for (String key : ['http.proxyHost','http.proxyPort','https.proxyHost','https.proxyPort','javax.net.ssl.trustStore']) {
                if (System.getProperty(key) != null) systemProperty key, System.getProperty(key)
            }
        }
    }
}
dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-datasource:1.8.0'
    implementation 'androidx.media3:media3-database:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.26.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

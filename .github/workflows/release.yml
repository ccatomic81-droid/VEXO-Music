name: Publish verified VEXO Music 0.29.2
on:
  push:
    branches: [main]
    paths: ['release/public-0.29.2.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vexo-release-0.29.2
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'ccatomic81-droid/VEXO-Music' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: vexo-v0.29.2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - name: Fetch and verify reviewed production APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist verify
          python3 - <<'PY'
          import json, pathlib, re, os
          m=json.loads(pathlib.Path('release/public-0.29.2.json').read_text())
          assert m['versionName']=='0.29.2' and m['versionCode']==49
          assert m['applicationId']=='space.vexo.music.radio'
          assert m['downloadUrl']=='https://vexo-music-updates.kavindukavishka785.workers.dev/releases/VEXO-Music-0.29.2.apk'
          assert re.fullmatch('[a-f0-9]{64}',m['sha256']) and re.fullmatch('[a-f0-9]{40}',m['sourceCommit'])
          assert m['sourceUrl']=='https://github.com/ccatomic81-droid/VEXO-Music/archive/'+m['sourceCommit']+'.zip'
          pathlib.Path('dist/SHA256SUMS.txt').write_text(m['sha256']+'  VEXO-Music-0.29.2.apk\n')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SOURCE_COMMIT='+m['sourceCommit']+'\n')
          PY
          curl --fail --location --retry 3 --max-time 120 --user-agent 'okhttp/4.12.0' 'https://vexo-music-updates.kavindukavishka785.workers.dev/releases/VEXO-Music-0.29.2.apk' --output dist/VEXO-Music-0.29.2.apk
          (cd dist && sha256sum --check SHA256SUMS.txt)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/VEXO-Music-0.29.2.apk > dist/signature.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 0b31c50904567389b723e23ad6043b2d2fc6635c30dfdb3ed5ef3f9ba9727ef3' dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/VEXO-Music-0.29.2.apk > dist/badging.txt
          grep "package: name='space.vexo.music.radio' versionCode='49' versionName='0.29.2'" dist/badging.txt
          if grep -q 'application-debuggable' dist/badging.txt; then exit 1; fi
          cp release/public-0.29.2.json dist/release-info.json
      - name: Create and verify draft before public release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > verify/existing.json 2>/dev/null; then
            python3 - <<'PY'
          import json,os
          r=json.load(open('verify/existing.json'))
          assert r['targetCommitish']==os.environ['SOURCE_COMMIT'], 'Refusing changed release target'
          PY
          else
            gh release create "$RELEASE_TAG" dist/VEXO-Music-0.29.2.apk dist/SHA256SUMS.txt dist/release-info.json --target "$SOURCE_COMMIT" --title 'VEXO Music 0.29.2' --notes-file release/notes-0.29.2.md --draft
          fi
          gh release download "$RELEASE_TAG" --dir verify --pattern VEXO-Music-0.29.2.apk --pattern SHA256SUMS.txt --pattern release-info.json
          cmp dist/SHA256SUMS.txt verify/SHA256SUMS.txt
          cmp dist/release-info.json verify/release-info.json
          (cd verify && sha256sum --check SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,isDraft,tagName,assets > verify/published.json
          python3 - <<'PY'
          import json,os
          r=json.load(open('verify/published.json'))
          assert not r['isDraft'] and r['tagName']=='vexo-v0.29.2'
          assert {a['name'] for a in r['assets']}=={'VEXO-Music-0.29.2.apk','SHA256SUMS.txt','release-info.json'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('Published verified [VEXO Music 0.29.2]('+r['url']+').\n')
          print(r['url'])
          PY

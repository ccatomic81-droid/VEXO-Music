name: Prepare signed VEXO Music 0.30.0-dev APK
on:
  push:
    branches: [feature/player-smart-queue-home-gradient]
    paths: ['.github/workflows/signed-update-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: vexo-signed-player-update
  cancel-in-progress: false
jobs:
  signed-apk:
    if: github.repository == 'ccatomic81-droid/VEXO-Music'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VEXO_KEYSTORE_PASSWORD: ${{ secrets.VEXO_KEYSTORE_PASSWORD }}
      VEXO_KEY_ALIAS: ${{ secrets.VEXO_KEY_ALIAS }}
      VEXO_KEY_PASSWORD: ${{ secrets.VEXO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the verified application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/ccatomic81-droid/VEXO-Music/actions/runs/41307802390 > "$RUNNER_TEMP/verified-checks.json"
          python3 - <<'PY'
          import json, os, pathlib
          check = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'verified-checks.json').read_text())
          assert check['head_sha'] == '613a3b1bf8a28beaee36c1ad608bcf6616ea471f'
          assert check['status'] == 'completed' and check['conclusion'] == 'success'
          PY
          git diff --exit-code 613a3b1bf8a28beaee36c1ad608bcf6616ea471f HEAD -- app gradle gradlew gradlew.bat build.gradle settings.gradle gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Load the original signing identity
        env:
          VEXO_KEYSTORE_BASE64: ${{ secrets.VEXO_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          required = ['VEXO_KEYSTORE_BASE64', 'VEXO_KEYSTORE_PASSWORD', 'VEXO_KEY_ALIAS', 'VEXO_KEY_PASSWORD']
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('The original VEXO signing secrets must be configured before this APK can be built.')
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vexo-original.keystore'
          key.write_bytes(base64.b64decode(os.environ['VEXO_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('VEXO_KEYSTORE_PATH=' + str(key) + '\n')
          PY
      - name: Build the signed release APK
        run: bash gradlew --no-daemon assembleRelease
      - name: Verify signature and update compatibility
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VEXO-Music-0.30.0-dev.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/VEXO-Music-0.30.0-dev.apk > dist/signature.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 0b31c50904567389b723e23ad6043b2d2fc6635c30dfdb3ed5ef3f9ba9727ef3' dist/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/VEXO-Music-0.30.0-dev.apk > dist/badging.txt
          grep "package: name='space.vexo.music.radio' versionCode='50' versionName='0.30.0-dev'" dist/badging.txt
          if grep -q 'application-debuggable' dist/badging.txt; then exit 1; fi
          (cd dist && sha256sum VEXO-Music-0.30.0-dev.apk > SHA256SUMS.txt)
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          apk = pathlib.Path('dist/VEXO-Music-0.30.0-dev.apk')
          value = {
              'versionName': '0.30.0-dev', 'versionCode': 50,
              'applicationId': 'space.vexo.music.radio',
              'sourceCommit': '613a3b1bf8a28beaee36c1ad608bcf6616ea471f',
              'buildCommit': os.environ['GITHUB_SHA'],
              'certificateSha256': '0b31c50904567389b723e23ad6043b2d2fc6635c30dfdb3ed5ef3f9ba9727ef3',
              'debuggable': False, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'size': apk.stat().st_size,
              'verifiedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'checks': 'https://github.com/ccatomic81-droid/VEXO-Music/actions/runs/41307802390',
              'build': 'https://github.com/ccatomic81-droid/VEXO-Music/actions/runs/' + os.environ['GITHUB_RUN_ID']
          }
          pathlib.Path('dist/verification.json').write_text(json.dumps(value, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: VEXO-Music-0.30.0-dev-signed
          path: dist/*
          retention-days: 30
          if-no-files-found: error
      - name: Remove the temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/vexo-original.keystore"

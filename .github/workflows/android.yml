name: Build VEXO Music APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check and build
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Check update service
        run: node --test update-service/service.test.mjs
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VEXO-Music-0.8.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/VEXO-Music-0.8.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/VEXO-Music-0.8.0.apk | grep "versionCode='10' versionName='0.8.0'"
          sha256sum dist/VEXO-Music-0.8.0.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VEXO-Music-CI-Test-APK
          path: dist/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VEXO-Music-checks
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/ui-checks/
          if-no-files-found: ignore
      - name: Probe live music discovery
        id: discovery_probe
        continue-on-error: true
        env:
          VEXO_MUSIC_LIVE_TEST: '1'
        run: bash gradlew --no-daemon testDebugUnitTest --tests '*MusicDiscoveryLiveTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VEXO-Music-live-discovery
          path: app/build/test-results/
          if-no-files-found: ignore

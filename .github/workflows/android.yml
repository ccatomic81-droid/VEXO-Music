name: Build VEXO Music APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'gradle/**', 'gradlew*', '*.gradle', 'gradle.properties', 'update-service/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'gradle/**', 'gradlew*', '*.gradle', 'gradle.properties', 'update-service/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check and build
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Check security and services
        run: |
          python3 tools/security-check.py
          node --check cloud-service/worker.mjs
          node --test update-service/*.test.mjs cloud-service/policy.test.mjs testing-service/service.test.mjs
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VEXO-Music-0.13.0-dev.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/VEXO-Music-0.13.0-dev.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/VEXO-Music-0.13.0-dev.apk | grep "versionCode='15' versionName='0.13.0-dev'"
          sha256sum dist/VEXO-Music-0.13.0-dev.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: VEXO-Music-CI-Test-APK
          path: dist/*
          retention-days: 30
      - name: Package unsigned production candidate
        run: |
          mkdir -p release-candidate
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-candidate/VEXO-Music-0.13.0-dev-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging release-candidate/VEXO-Music-0.13.0-dev-unsigned.apk > release-candidate/badging.txt
          grep "versionCode='15' versionName='0.13.0-dev'" release-candidate/badging.txt
          if grep -q 'application-debuggable' release-candidate/badging.txt; then exit 1; fi
          (cd release-candidate && sha256sum VEXO-Music-0.13.0-dev-unsigned.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: VEXO-Music-Production-Candidate
          path: release-candidate/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VEXO-Music-checks
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/ui-checks/
          if-no-files-found: ignore
      - name: Probe live music discovery
        id: discovery_probe
        continue-on-error: true
        env:
          VEXO_MUSIC_LIVE_TEST: '1'
        run: bash gradlew --no-daemon testDebugUnitTest --tests '*MusicDiscoveryLiveTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VEXO-Music-live-discovery
          path: app/build/test-results/
          if-no-files-found: ignore
